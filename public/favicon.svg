<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="50%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>

    <!-- Warm Golden Amber Primary Gradient -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837"/>
      <stop offset="35%" stop-color="#FF9500"/>
      <stop offset="70%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D95300"/>
    </linearGradient>

    <!-- Bright Gold Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#FFA834"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>

    <!-- Metallic Shadow Gradient -->
    <linearGradient id="goldShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B84200"/>
      <stop offset="100%" stop-color="#E66A00"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#FF8C42" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Subtle Rim Glow -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="white" stroke-width="0.8" stroke-opacity="0.08"/>

  <!-- Glowing Aura Behind Letters -->
  <circle cx="64" cy="64" r="32" fill="#FF6A00" opacity="0.18" filter="url(#goldGlow)"/>

  <!-- GM Monogram Group -->
  <g transform="translate(19, 28)">
    <!-- Letter G -->
    <!-- Top & Left spine of G with origami facet cuts -->
    <path d="M 28 6 L 10 16 L 3 36 L 3 48 L 10 68 L 28 78 L 36 68 L 13 60 L 13 24 L 28 16 L 36 24 L 43 14 Z" fill="url(#goldGrad1)"/>
    <path d="M 10 16 L 28 6 L 36 14 L 18 24 Z" fill="url(#goldHighlight)"/>
    <path d="M 3 36 L 13 36 L 13 60 L 10 68 Z" fill="url(#goldShadow)"/>
    
    <!-- G Crossbar / Inner Shelf -->
    <path d="M 24 43 L 42 43 L 42 70 L 32 70 L 32 53 L 24 53 Z" fill="url(#goldHighlight)"/>
    <path d="M 24 43 L 34 38 L 42 43 L 32 53 Z" fill="url(#goldGrad1)"/>
    <path d="M 32 53 L 42 43 L 42 70 L 32 70 Z" fill="url(#goldShadow)"/>

    <!-- Letter M with Envelope Geometry -->
    <!-- Left leg of M -->
    <path d="M 45 28 L 54 28 L 54 74 L 45 74 Z" fill="url(#goldGrad1)"/>
    
    <!-- M Central V / Envelope Flap -->
    <polygon points="45,28 66,54 54,28" fill="url(#goldShadow)"/>
    <polygon points="54,28 66,54 78,28" fill="url(#goldHighlight)"/>
    <polygon points="66,54 78,28 87,28" fill="url(#goldGrad1)"/>

    <!-- Right leg of M -->
    <path d="M 78 28 L 87 28 L 87 74 L 78 74 Z" fill="url(#goldHighlight)"/>

    <!-- Envelope Bottom Body Fold within M -->
    <polygon points="49,74 66,56 83,74" fill="url(#goldShadow)" opacity="0.95"/>
    <polygon points="52,74 66,59 80,74" fill="url(#goldHighlight)" opacity="0.35"/>
  </g>
</svg>
